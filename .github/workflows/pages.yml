name: Deploy to GitHub Pages

# The site is built from data/postings.tsv here rather than deployed from the
# committed index.html: rebuild.yml pushes with GITHUB_TOKEN, and those pushes
# do not trigger workflows, so waiting for an index.html push would leave the
# live site a day behind. The daily schedule also ages stale rows off the site
# on days nothing is committed at all.
on:
  push:
    branches: [main]
    paths: ['index.html', 'data/postings.tsv', 'scripts/build.py', '.github/workflows/pages.yml']
  schedule:
    - cron: '45 11 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and stage site
        run: |
          python3 scripts/build.py
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
