name: Daily scan

# Fetches the public trackers, appends anything new to data/postings.tsv,
# rebuilds README.md + index.html, and opens a PR.
#
# Deliberately opens a PR rather than pushing to main: the trackers are
# third-party markdown and their format can change without warning, so a bad
# parse should never land unreviewed. Check scan-report.md in the PR — it lists
# sources that failed and companies with no category rule.

on:
  # Half an hour after rebuild.yml, so the scan starts from an already-pruned
  # main and its PR is a pure addition of newly found rows.
  schedule:
    - cron: '30 11 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to scan (use 30 for the initial backfill)'
        default: '2'

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify parser still works
        run: python3 tests/test_parse.py

      - name: Scan trackers
        run: python3 scripts/scan.py --days "${{ github.event.inputs.days || 2 }}"

      # Sanity check only -- nothing build.py touches is committed to the PR.
      # README.md/index.html and the dropping of stale TSV rows are all handled
      # on main by rebuild.yml. Keeping them off the branch is what stops the
      # daily merge conflict: the PR diff becomes purely additive.
      - name: Verify the site still builds
        run: |
          cp data/postings.tsv "$RUNNER_TEMP/postings.tsv"
          python3 scripts/build.py
          mv "$RUNNER_TEMP/postings.tsv" data/postings.tsv

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: daily scan"
          title: "Daily scan — new 2027 postings"
          body-path: scan-report.md
          branch: scan/daily
          delete-branch: true
          add-paths: |
            data/postings.tsv
            data/categories.tsv
